  <title>Balabolka Web</title>
  <style>
    /* ===== Editor TTS Colors (user-configurable) ===== */
    :root {
      --text-color: #000000;
      --bg-color: #ffffff;
      --read-color: #cc0000;
      --highlight-color: #0066ff;
      --cursor-color: #00ff66;
    }

    /* ===== Shell/UI Theme Variables ===== */
    :root {
      /* Light theme (default) */
      --ui-shell-bg:       #ece9d8;
      --ui-shell-border:   #aca899;
      --ui-shell-shadow:   white;
      --ui-menu-bg:        #ece9d8;
      --ui-menu-hover:     #cce8ff;
      --ui-menu-hover-bdr: #99d1ff;
      --ui-dropdown-bg:    white;
      --ui-tabbar-bg:      #d4d0c8;
      --ui-tab-inactive:   #c0c0c0;
      --ui-tab-inactive-hover: #d0d0d0;
      --ui-tab-text:       #000;
      --ui-tab-inactive-text: #4b5563;
      --ui-status-bg:      #f0f0f0;
      --ui-status-text:    #000;
      --ui-voice-label:    #374151;
      --ui-slider-label:   #374151;
      --ui-vp-bg:          white;
      --ui-vp-hover:       #f0f8ff;
      --ui-vp-grp-bg:      #f3f4f6;
      --ui-vp-grp-text:    #4b5563;
      --ui-vp-opt-text:    #000;
      --ui-vp-lang-bg:     #f3f4f6;
      --ui-vp-lang-text:   #6b7280;
      --ui-btn-bg:         linear-gradient(to bottom, #ffffff, #e0e0e0);
      --ui-btn-bdr:        #003c74;
      --ui-drag-box-bg:    #ece9d8;
      --ui-modal-bg:       #ece9d8;
      --ui-scrollbar-track:#f0f0f0;
      --ui-scrollbar-thumb:#aca899;
      --ui-no-tts-bg:      #ece9d8;
    }

    /* ===== Dark shell theme ===== */
    body.dark-ui {
      --ui-shell-bg:       #1e2028;
      --ui-shell-border:   #3a3d4a;
      --ui-shell-shadow:   #111;
      --ui-menu-bg:        #1e2028;
      --ui-menu-hover:     #2a3a52;
      --ui-menu-hover-bdr: #3a6fa8;
      --ui-dropdown-bg:    #252830;
      --ui-tabbar-bg:      #15171d;
      --ui-tab-inactive:   #252830;
      --ui-tab-inactive-hover: #2e3240;
      --ui-tab-text:       #d4d8e8;
      --ui-tab-inactive-text: #8892aa;
      --ui-status-bg:      #252830;
      --ui-status-text:    #b0b8cc;
      --ui-voice-label:    #9aaac4;
      --ui-slider-label:   #9aaac4;
      --ui-vp-bg:          #252830;
      --ui-vp-hover:       #2a3a52;
      --ui-vp-grp-bg:      #1a1c24;
      --ui-vp-grp-text:    #7a8aaa;
      --ui-vp-opt-text:    #c8d0e4;
      --ui-vp-lang-bg:     #1a1c24;
      --ui-vp-lang-text:   #6b7280;
      --ui-btn-bg:         linear-gradient(to bottom, #2e3240, #1e2028);
      --ui-btn-bdr:        #3a6fa8;
      --ui-drag-box-bg:    #252830;
      --ui-modal-bg:       #252830;
      --ui-scrollbar-track:#15171d;
      --ui-scrollbar-thumb:#3a3d4a;
      --ui-no-tts-bg:      #252830;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #app { height: 100%; width: 100%; overflow: hidden; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--ui-shell-bg); }

    .titlebar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 8px; height: 32px; flex-shrink: 0;
      background: linear-gradient(to bottom, #0058e6, #3a93ff);
    }
    .titlebar-controls { display: flex; align-items: center; gap: 4px; }
    .titlebar-title { display: flex; align-items: center; gap: 8px; color: white; font-weight: bold; font-size: 12px; }
    .titlebar-fs { width: 20px; height: 20px; font-size: 10px; color: white; border: 1px solid rgba(255,255,255,0.5); border-radius: 2px; display: flex; align-items: center; justify-content: center; background: transparent; cursor: pointer; }
    .titlebar-fs:hover { background: rgba(255,255,255,0.2); }
    .titlebar-theme { width: 20px; height: 20px; font-size: 12px; color: white; border: 1px solid rgba(255,255,255,0.5); border-radius: 2px; display: flex; align-items: center; justify-content: center; background: transparent; cursor: pointer; line-height: 1; }
    .titlebar-theme:hover { background: rgba(255,255,255,0.2); }

    .menubar { display: flex; background: var(--ui-menu-bg); border-bottom: 1px solid var(--ui-shell-border); flex-shrink: 0; position: relative; z-index: 200; }
    .menu-btn { padding: 2px 8px; font-size: 12px; background: transparent; border: 1px solid transparent; cursor: pointer; color: var(--ui-tab-text); }
    .menu-btn:hover, .menu-btn.active { background: var(--ui-menu-hover); border-color: var(--ui-menu-hover-bdr); }
    .menu-dropdown { position: absolute; top: 100%; left: 0; background: var(--ui-dropdown-bg); border: 1px solid var(--ui-shell-border); box-shadow: 2px 2px 6px rgba(0,0,0,0.3); min-width: 280px; z-index: 500; padding: 4px 0; }
    .menu-item { width: 100%; text-align: left; padding: 4px 16px; font-size: 12px; display: flex; justify-content: space-between; align-items: center; gap: 32px; background: transparent; border: none; cursor: pointer; white-space: nowrap; color: var(--ui-tab-text); }
    .menu-item:hover { background: var(--ui-menu-hover); }
    .menu-item .shortcut { color: #9ca3af; font-size: 10px; }
    .menu-sep { border-top: 1px solid var(--ui-shell-border); margin: 3px 0; }

    .toolbar { display: flex; align-items: center; padding: 4px; background: var(--ui-shell-bg); border-bottom: 1px solid var(--ui-shell-border); flex-shrink: 0; flex-wrap: wrap; gap: 2px; }
    .toolbar-btn { display: flex; align-items: center; justify-content: center; border: 1px solid transparent; cursor: pointer; background: transparent; transition: border-color 0.1s, background 0.1s; width: 28px; height: 28px; font-size: 14px; line-height: 1; }
    .toolbar-btn:hover, .toolbar-btn.active { border-color: var(--ui-menu-hover-bdr); background: var(--ui-menu-hover); }
    .toolbar-sep { width: 1px; height: 20px; background: var(--ui-shell-border); box-shadow: 1px 0 0 var(--ui-shell-shadow); margin: 0 4px; }

    .voice-panel { display: flex; flex-direction: column; gap: 6px; padding: 6px 8px; background: var(--ui-shell-bg); border-bottom: 1px solid var(--ui-shell-border); flex-shrink: 0; }
    .voice-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .voice-label { font-size: 12px; font-weight: 600; color: var(--ui-voice-label); white-space: nowrap; }
    .sliders-row { display: flex; gap: 16px; padding: 0 4px; flex-wrap: wrap; }
    .slider-group { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 140px; }
    .slider-label { font-size: 10px; color: var(--ui-slider-label); white-space: nowrap; width: 64px; font-weight: 600; }
    .slider-value { font-size: 10px; color: var(--ui-slider-label); width: 40px; text-align: right; font-family: monospace; font-weight: bold; }

    .voice-picker-wrap { position: relative; min-width: 220px; flex: 1; max-width: 360px; }
    .voice-picker-display { font-size: 12px; border: 1px solid var(--ui-shell-border); padding: 3px 6px; background: var(--ui-vp-bg); color: var(--ui-vp-opt-text); cursor: pointer; display: flex; align-items: center; justify-content: space-between; user-select: none; }
    .voice-picker-display:hover { background: var(--ui-vp-hover); }
    .voice-picker-dropdown {
      position: absolute; top: 100%; left: 0; right: 0;
      background: var(--ui-vp-bg); border: 1px solid var(--ui-shell-border);
      box-shadow: 2px 2px 6px rgba(0,0,0,0.3);
      z-index: 600;
      max-height: 260px;
      overflow: hidden;
    }
    .voice-picker-search { padding: 4px 6px; border-bottom: 1px solid var(--ui-shell-border); }
    .voice-picker-search input { width: 100%; font-size: 12px; border: 1px solid var(--ui-shell-border); padding: 3px 6px; outline: none; background: var(--ui-vp-bg); color: var(--ui-vp-opt-text); }
    .voice-group-label { font-size: 10px; font-weight: bold; color: var(--ui-vp-grp-text); background: var(--ui-vp-grp-bg); padding: 3px 8px; border-top: 1px solid var(--ui-shell-border); text-transform: uppercase; letter-spacing: 0.5px; }
    .voice-option { padding: 4px 10px; font-size: 12px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; color: var(--ui-vp-opt-text); }
    .voice-option:hover, .voice-option.selected { background: var(--ui-menu-hover); }
    .voice-option .lang-tag { font-size: 10px; color: var(--ui-vp-lang-text); background: var(--ui-vp-lang-bg); padding: 1px 4px; border-radius: 2px; }
    .voice-no-results { padding: 8px; font-size: 12px; color: #9ca3af; text-align: center; }

    .tabbar { display: flex; align-items: flex-end; background: var(--ui-tabbar-bg); border-bottom: 1px solid var(--ui-shell-border); flex-shrink: 0; padding: 4px 4px 0; gap: 2px; overflow-x: auto; }
    .tab-item { display: flex; align-items: center; gap: 4px; padding: 2px 12px; font-size: 12px; cursor: pointer; border: 1px solid var(--ui-shell-border); border-bottom: none; max-width: 140px; overflow: hidden; white-space: nowrap; user-select: none; color: var(--ui-tab-text); }
    .tab-item.active { background: var(--ui-shell-bg); font-weight: 600; position: relative; z-index: 10; color: var(--ui-tab-text); }
    .tab-item:not(.active) { background: var(--ui-tab-inactive); color: var(--ui-tab-inactive-text); }
    .tab-item:not(.active):hover { background: var(--ui-tab-inactive-hover); }
    .tab-close { color: #9ca3af; font-weight: bold; cursor: pointer; margin-left: 2px; background: none; border: none; font-size: 13px; line-height: 1; padding: 0; }
    .tab-close:hover { color: #ef4444; }
    .tab-add { padding: 2px 8px; font-size: 12px; border: 1px solid var(--ui-shell-border); background: var(--ui-tab-inactive); color: var(--ui-tab-inactive-text); cursor: pointer; font-weight: bold; }
    .tab-add:hover { background: var(--ui-tab-inactive-hover); }
    .tab-input { border: 1px solid #2563eb; padding: 2px 4px; font-size: 12px; outline: none; width: 100px; background: var(--ui-vp-bg); color: var(--ui-tab-text); }

    .main-area { display: flex; flex: 1; position: relative; overflow: hidden; }
    .editor-container { flex: 1; position: relative; overflow: hidden; }
    .editor-area { width: 100%; height: 100%; padding: 12px; resize: none; outline: none; border: none; overflow-y: auto; overflow-x: hidden; scroll-behavior: smooth; touch-action: pan-y; overscroll-behavior: auto; white-space: pre-wrap; word-break: break-word; }

    .token { transition: background-color 0.1s, color 0.1s; border-radius: 2px; }
    .token.read { color: var(--read-color); }
    .token.active { background-color: var(--highlight-color); color: #fff; font-weight: bold; padding: 0 2px; position: relative; }
    .token.active::after { content: ""; position: absolute; left: -1px; top: 0; bottom: 0; width: 2px; background-color: var(--cursor-color); animation: karaoke-blink 1s steps(1) infinite; pointer-events: none; }
    .token .unread-part { color: inherit; }
    .token.active .unread-part { color: #fff; }
    .token .char-cursor { display: inline-block; width: 2px; height: 1.1em; background-color: var(--cursor-color); vertical-align: text-bottom; animation: karaoke-blink 1s steps(1) infinite; pointer-events: none; margin: 0 -1px; }
    .token.active .char-cursor { background-color: #fff; }
    @keyframes karaoke-blink { 50% { opacity: 0; } }

    .statusbar { display: flex; align-items: center; height: 24px; padding: 0 4px; background: var(--ui-shell-bg); border-top: 1px solid var(--ui-shell-border); flex-shrink: 0; gap: 8px; font-size: 10px; }
    .status-item { border: 1px solid var(--ui-shell-border); border-right-color: var(--ui-shell-shadow); border-bottom-color: var(--ui-shell-shadow); padding: 1px 4px; background: var(--ui-status-bg); color: var(--ui-status-text); white-space: nowrap; }
    .statusbar-spacer { flex: 1; }

    .modal-overlay { position: fixed; inset: 0; z-index: 1000; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.3); }
    .modal-box { background: var(--ui-modal-bg); display: flex; flex-direction: column; box-shadow: 4px 4px 16px rgba(0,0,0,0.5); border: 2px solid var(--ui-shell-shadow); border-right-color: #404040; border-bottom-color: #404040; max-height: 90vh; overflow-y: auto; }
    .modal-titlebar { display: flex; align-items: center; justify-content: space-between; padding: 5px 10px; font-weight: bold; font-size: 12px; color: white; flex-shrink: 0; background: linear-gradient(to right, #0058e6, #3a93ff); user-select: none; cursor: move; }
    .modal-close { width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; background: transparent; border: none; color: white; cursor: pointer; font-size: 11px; border-radius: 2px; }
    .modal-close:hover { background: #ef4444; }
    .xp-btn { font-size: 12px; padding: 2px 16px; cursor: pointer; border: 1px solid var(--ui-btn-bdr); background: var(--ui-btn-bg); color: var(--ui-tab-text); }
    .xp-btn:hover { filter: brightness(1.1); }
    .xp-btn.cancel { border-color: #9ca3af; }
    .xp-input { font-size: 12px; border: 1px solid var(--ui-shell-border); padding: 2px 6px; width: 100%; outline: none; background: var(--ui-vp-bg); color: var(--ui-tab-text); }
    .xp-select { font-size: 12px; border: 1px solid var(--ui-shell-border); padding: 2px 4px; outline: none; background: var(--ui-vp-bg); color: var(--ui-tab-text); width: 100%; }

    .drag-overlay { position: absolute; inset: 0; background: rgba(0,88,230,0.3); border: 4px dashed #0058e6; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; }
    .drag-box { background: var(--ui-drag-box-bg); padding: 32px; border: 2px solid var(--ui-shell-shadow); box-shadow: 0 8px 32px rgba(0,0,0,0.3); display: flex; flex-direction: column; align-items: center; gap: 12px; color: var(--ui-tab-text); }

    .no-tts-overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.8); z-index: 30; }
    .no-tts-box { background: var(--ui-no-tts-bg); padding: 24px; border: 2px solid #808080; max-width: 320px; text-align: center; color: var(--ui-tab-text); }

    .play-stop-btn { font-size: 12px; padding: 2px 12px; border-radius: 0; cursor: pointer; font-weight: bold; border: 1px solid; }
    .play-stop-btn.play { border-color: #16a34a; background: #dcfce7; color: #15803d; }
    .play-stop-btn.stop { border-color: #ef4444; background: #fee2e2; color: #b91c1c; }

    .color-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .color-row label { font-size: 12px; color: var(--ui-voice-label); flex: 1; }
    .color-preview { width: 24px; height: 24px; border: 1px solid #9ca3af; border-radius: 2px; }

    .notif { position: fixed; bottom: 40px; right: 16px; z-index: 1100; background: rgba(0,0,0,0.7); color: white; font-size: 11px; padding: 6px 12px; border-radius: 4px; pointer-events: none; display: flex; align-items: center; gap: 6px; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }

    ::-webkit-scrollbar { width: 12px; height: 12px; }
    ::-webkit-scrollbar-track { background: var(--ui-scrollbar-track); }
    ::-webkit-scrollbar-thumb { background: var(--ui-scrollbar-thumb); border: 2px solid var(--ui-scrollbar-track); }
    ::-webkit-scrollbar-thumb:hover { background: #888; }

    /* Transition suave ao trocar de tema */
    body, .menubar, .toolbar, .voice-panel, .tabbar, .statusbar, .modal-box,
    .menu-dropdown, .voice-picker-display, .voice-picker-dropdown,
    .tab-item, .status-item { transition: background-color 0.25s, color 0.15s, border-color 0.2s; }
  #editor {padding:0;overflow:hidden;scroll-behavior:auto;white-space:normal;word-break:normal;}
.cm-editor {font-weight:inherit;font-style:inherit;}

<body>
  <div id="app" style="display:flex; flex-direction:column; height:100vh; width:100vw; overflow:hidden;">
    <div class="titlebar">
      <div class="titlebar-title">
        <span style="font-size:16px">📝</span>
        <span id="window-title">Balabolka Web</span>
      </div>
      <div class="titlebar-controls">
        <button class="titlebar-theme" id="btn-theme" title="Alternar tema claro/escuro">🌙</button>
        <button class="titlebar-fs" id="btn-fs" title="Tela cheia">⛶</button>
      </div>
    </div>

    <div class="menubar" id="menubar">
      <div style="position:relative;"><button class="menu-btn" data-menu="arquivo">Arquivo</button></div>
      <div style="position:relative;"><button class="menu-btn" data-menu="editar">Editar</button></div>
      <div style="position:relative;"><button class="menu-btn" data-menu="fala">Fala</button></div>
      <div style="position:relative;"><button class="menu-btn" data-menu="exibir">Exibir</button></div>
      <div style="position:relative;"><button class="menu-btn" data-menu="ajuda">Ajuda</button></div>
    </div>

    <div class="toolbar" id="toolbar">
      <button class="toolbar-btn" id="tb-new" title="Novo (Ctrl+N)">🆕</button>
      <button class="toolbar-btn" id="tb-open" title="Abrir (Ctrl+O)">📂</button>
      <button class="toolbar-btn" id="tb-save" title="Salvar texto (Ctrl+S)">💾</button>
      <div class="toolbar-sep"></div>
      <button class="toolbar-btn" id="tb-copy" title="Copiar">📋</button>
      <button class="toolbar-btn" id="tb-paste" title="Colar">📄</button>
      <button class="toolbar-btn" id="tb-select-all" title="Selecionar tudo">🔲</button>
      <button class="toolbar-btn" id="tb-undo" title="Desfazer (Ctrl+Z)">↩️</button>
      <button class="toolbar-btn" id="tb-redo" title="Refazer (Ctrl+Y)">↪️</button>
      <div class="toolbar-sep"></div>
      <button class="toolbar-btn" id="tb-find" title="Localizar/Substituir (Ctrl+H)">🔍</button>
      <div class="toolbar-sep"></div>
      <button class="toolbar-btn" id="tb-md" title="Markdown">MD</button>
      <div class="toolbar-sep"></div>
      <button class="toolbar-btn" id="tb-play" title="Ler (F5)">▶️</button>
      <button class="toolbar-btn" id="tb-pause" title="Pausar (F6)">⏸️</button>
      <button class="toolbar-btn" id="tb-stop" title="Parar (Esc)">⏹️</button>
      <div class="toolbar-sep"></div>
      <button class="toolbar-btn" id="tb-test" title="Testar voz">🔊</button>
      <div class="toolbar-sep"></div>
      <button class="toolbar-btn" id="tb-font" title="Fontes e Cores">🔤</button>
      <button class="toolbar-btn" id="tb-size" title="Tamanho dos botões">⚙️</button>
      <div class="toolbar-sep"></div>
      <button class="toolbar-btn" id="tb-close" title="Fechar documento">✕</button>
      <button class="toolbar-btn" id="tb-close-all" title="Fechar todos">🗑️</button>
      <button class="toolbar-btn" id="tb-close-others" title="Manter apenas esta guia">📌</button>
    </div>

    <div class="voice-panel">
      <div class="voice-row">
        <span class="voice-label">Voz:</span>
        <div class="voice-picker-wrap" id="voice-picker-wrap">
          <div class="voice-picker-display" id="voice-picker-display">Selecione uma voz...</div>
          <div class="voice-picker-dropdown" id="voice-picker-dropdown" style="display:none;">
            <div class="voice-picker-search"><input type="text" id="voice-search-input" placeholder="Pesquisar voz..."></div>
            <div class="voice-picker-list" id="voice-picker-list"></div>
          </div>
        </div>
        <button class="xp-btn" id="btn-test-voice" style="white-space:nowrap">🔊 Testar</button>
        <button class="play-stop-btn play" id="btn-play-big">▶ Ler</button>
      </div>
      <div class="sliders-row">
        <div class="slider-group">
          <span class="slider-label">Velocidade:</span>
          <input type="range" id="range-rate" min="0.1" max="10" step="0.1" value="1" style="flex:1; height:4px; cursor:pointer;">
          <span class="slider-value" id="val-rate">1.0x</span>
        </div>
        <div class="slider-group">
          <span class="slider-label">Tonalidade:</span>
          <input type="range" id="range-pitch" min="0" max="2" step="0.05" value="1" style="flex:1; height:4px; cursor:pointer;">
          <span class="slider-value" id="val-pitch">1.00</span>
        </div>
        <div class="slider-group">
          <span class="slider-label">Volume:</span>
          <input type="range" id="range-volume" min="0" max="1" step="0.01" value="1" style="flex:1; height:4px; cursor:pointer;">
          <span class="slider-value" id="val-volume">100%</span>
        </div>
      </div>
    </div>

    <div class="tabbar" id="tabbar"></div>

    <div class="main-area" id="drop-zone">
      <div class="editor-container">
        <div id="editor" class="editor-area" contenteditable="false" style="background:#ffffff; color:#000000; font-family:'Courier New', monospace; font-size:14px; line-height:1.4;"></div>
        <div id="md-viewer" class="editor-area" style="display:none; background:#ffffff; color:#000000; font-family:'Segoe UI', sans-serif; font-size:14px; line-height:1.4; white-space:normal;"></div>
        <div id="no-tts" class="no-tts-overlay" style="display:none;">
          <div class="no-tts-box">
            <div style="font-size:40px; margin-bottom:12px">⚠️</div>
            <h2 style="font-weight:bold; font-size:13px; margin-bottom:8px">Web Speech API ausente</h2>
            <p style="font-size:12px; color:#6b7280">Use Chrome ou Edge para usufruir da síntese de áudio.</p>
          </div>
        </div>
      </div>
    </div>

    <div class="statusbar" id="statusbar">
      <span class="status-item" id="st-doc">Documento1</span>
      <span class="status-item" id="st-lines">Linhas: 1</span>
      <span class="status-item" id="st-words">Palavras: 0</span>
      <span class="status-item" id="st-chars">Chars: 0</span>
      <span class="status-item" id="st-zoom">Zoom: 100%</span>
      <span class="status-item" id="st-cursor">Cursor: 0 de 0</span>
      <span class="status-item" id="st-time">Tempo estimado: 0m 0s</span>
      <span class="status-item" id="st-voice">Sem voz</span>
      <div class="statusbar-spacer"></div>
      <span class="status-item" id="st-status">⏹ Parado</span>
      <span class="status-item" id="st-lang">—</span>
    </div>
  </div>

  <input type="file" id="file-input" style="display:none" multiple accept=".txt,.md,.html,.htm">
  <div id="modals"></div>

    volume: LS.get('balabolka_volume', 1.0),

    font: LS.get('balabolka_font', { family: 'Courier New', size: 14, bold: false, italic: false, lineHeight: 1.4 }),

  // === DOM refs ===
  const $ = id => document.getElementById(id);
  const editor = $('editor');

  editor.addEventListener('click', () => updateStatus());
  editor.addEventListener('keyup', () => updateStatus());

  const mdViewer = $('md-viewer');
  const tabbar = $('tabbar');
  const fileInput = $('file-input');
  const modals = $('modals');
  const dropZone = $('drop-zone');
  const root = document.documentElement;
  const voicePickerDisplay = $('voice-picker-display');
  const voicePickerDropdown = $('voice-picker-dropdown');
  const voicePickerList = $('voice-picker-list');
  const voiceSearchInput = $('voice-search-input');

  let sourceStats={text:null,lines:1,words:0};
  const cm = BalaEditor.create(editor, text => {
    if(state.isPlaying || state.isPaused){const selection=cm.selection();stopSpeech();cm.select(selection.anchor,selection.head);}
    if(state.hasTokenSpans) clearReadingView();

  editor.focus = () => cm.focus();
  // Documents are committed atomically in IndexedDB, never silently dropped on quota errors.
  let dbPromise = null, saveTimer = null, saveQueue = Promise.resolve(), pendingSave = false;

  function openDB() {
    if (!dbPromise) dbPromise = new Promise((resolve,reject)=>{
      if(!window.indexedDB){reject(new Error('IndexedDB indisponível'));return;}
      const request=indexedDB.open('balabolka_documents',1);
      request.onupgradeneeded=()=>request.result.createObjectStore('workspace');
      request.onsuccess=()=>resolve(request.result);
      request.onerror=()=>reject(request.error);
      request.onblocked=()=>reject(new Error('Banco bloqueado por outra janela'));
    });
    return dbPromise;
  }
  function storageMessage(message,failed=false) {
    let el=$('storage-message');
    if(!el){el=document.createElement('div');el.id='storage-message';el.style.cssText='position:fixed;bottom:28px;right:12px;z-index:999;background:#fff4c4;color:#222;padding:8px;border:1px solid #b98b00;max-width:540px';document.body.appendChild(el);}
    el.textContent=message;el.style.display=message?'block':'none';el.setAttribute('role',failed?'alert':'status');
  }
  function saveTabs() {
    pendingSave=true;saveRevision++;clearTimeout(saveTimer);
    saveTimer=setTimeout(()=>flushSave().catch(()=>{}),500);
  }
  function flushSave() {
    clearTimeout(saveTimer);
    if(!pendingSave)return saveQueue;
    pendingSave=false;
    const revision=saveRevision;
    const snapshot={tabs:[...state.tabs],texts:[...state.texts],activeTab:state.activeTab,originalMdTexts:[...state.originalMdTexts]};
    saveQueue=saveQueue.catch(()=>{}).then(async()=>{
      const db=await openDB();
      await new Promise((resolve,reject)=>{
        const tx=db.transaction('workspace','readwrite');
        tx.objectStore('workspace').put(snapshot,'current');
        tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error||new Error('Transação abortada'));
      });
      storedRevision=revision;
      // Only remove the legacy payload after the new transactional store has committed.
      ['balabolka_tabs','balabolka_texts','balabolka_activeTab','balabolka_originalMdTexts'].forEach(k=>localStorage.removeItem(k));
      storageMessage('');showSavedNotif();
    }).catch(e=>{
      pendingSave=true;
      storageMessage('Falha ao salvar automaticamente: '+e.message+'. Use Ctrl+S para exportar antes de fechar.',true);
      throw e;
    });
    return saveQueue;
  }
  async function restoreWorkspace() {
    try {
      const db=await openDB();
      const snapshot=await new Promise((resolve,reject)=>{
        const request=db.transaction('workspace').objectStore('workspace').get('current');
        request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error);
      });
      if(snapshot && Array.isArray(snapshot.tabs)&&Array.isArray(snapshot.texts)&&snapshot.tabs.length===snapshot.texts.length&&snapshot.tabs.length){
        state.tabs=snapshot.tabs;state.texts=snapshot.texts;state.originalMdTexts=snapshot.originalMdTexts||[];
        state.activeTab=Math.max(0,Math.min(snapshot.tabs.length-1,snapshot.activeTab||0));

  }

  function setCSSColors() {
    root.style.setProperty('--text-color', state.colors.text);
    root.style.setProperty('--bg-color', state.colors.bg);
    root.style.setProperty('--read-color', state.colors.read);
    root.style.setProperty('--highlight-color', state.colors.highlight);
    root.style.setProperty('--cursor-color', '#00ff66');
  }
  setCSSColors();

  // CodeMirror handles native plain-text copy/cut/paste across virtual viewports.
  // Toolbar access uses the secure Clipboard API; browser keyboard shortcuts remain native.

  // === Markdown ===
  function stripMarkdown(text) {
    if (!text) return '';
    return text
      .replace(/```[\s\S]*?```/g, '')
      .replace(/`([^`]+)`/g, '$1')
      .replace(/!\[[^\]]*\]\([^)]+\)/g, '')
      .replace(/\[([^\]]+)\]\([^)]+\)/g, '$1')
      .replace(/\*\*([^*]+)\*\*/g, '$1')
      .replace(/__([^_]+)__/g, '$1')
      .replace(/\*([^*]+)\*/g, '$1')
      .replace(/_([^_]+)_/g, '$1')
      .replace(/~~([^~]+)~~/g, '$1')
      .replace(/^#{1,6}\s+/gm, '')
      .replace(/^>\s*/gm, '')
      .replace(/^(---|___|\*\*\*)\s*$/gm, '')
      .replace(/^\s*[-*+]\s+/gm, '')
      .replace(/^\s*\d+\.\s+/gm, '')
      .replace(/\|/g, ' ');
  }

  function renderMarkdown(md) {
    if (!md) return '';
    let html = escapeHtml(md)
      .replace(/```([\s\S]*?)```/g, '<pre style="background:rgba(0,0,0,0.05); border:1px solid #ccc; padding:8px; overflow:auto; font-family:monospace; font-size:0.9em;">$1</pre>')
      .replace(/`([^`]+)`/g, '<code style="background:rgba(0,0,0,0.05); border:1px solid #ccc; padding:2px 4px; font-family:monospace; font-size:0.9em;">$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/__([^_]+)__/g, '<strong>$1</strong>')
      .replace(/\*([^*]+)\*/g, '<em>$1</em>')
      .replace(/_([^_]+)_/g, '<em>$1</em>')
      .replace(/~~([^~]+)~~/g, '<del>$1</del>')
      .replace(/!\[([^\]]*)\]\([^)]+\)/g, '<span style="display:inline-flex; align-items:center; gap:4px; border:1px solid #ccc; padding:2px 6px; background:rgba(0,0,0,0.05); border-radius:4px; font-size:0.9em;">🖼️ $1</span>')
      .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" style="color:#2563eb; text-decoration:underline;">$1</a>')
      .replace(/^#{1}\s+(.*)$/gm, '<h1 style="font-size:1.8em; margin:12px 0 6px; font-weight:bold; line-height:1.2;">$1</h1>')
      .replace(/^#{2}\s+(.*)$/gm, '<h2 style="font-size:1.5em; margin:12px 0 6px; font-weight:bold; line-height:1.2;">$1</h2>')
      .replace(/^#{3}\s+(.*)$/gm, '<h3 style="font-size:1.3em; margin:12px 0 6px; font-weight:bold; line-height:1.2;">$1</h3>')
      .replace(/^#{4}\s+(.*)$/gm, '<h4 style="font-size:1.1em; margin:12px 0 6px; font-weight:bold; line-height:1.2;">$1</h4>')
      .replace(/^#{5}\s+(.*)$/gm, '<h5 style="font-size:1.0em; margin:12px 0 6px; font-weight:bold; line-height:1.2;">$1</h5>')
      .replace(/^#{6}\s+(.*)$/gm, '<h6 style="font-size:0.9em; margin:12px 0 6px; font-weight:bold; line-height:1.2;">$1</h6>')
      .replace(/^&gt;\s+(.*)$/gm, '<blockquote style="border-left:4px solid #2563eb; padding-left:12px; margin:8px 0; font-style:italic; opacity:0.85;">$1</blockquote>')
      .replace(/^\s*[-*+]\s+(.*)$/gm, '<li style="margin:4px 0;">$1</li>')
      .replace(/^(\d+)\.\s+(.*)$/gm, '<li style="margin:4px 0;">$2</li>')
      .replace(/^(---|___|\*\*\*)\s*$/gm, '<hr style="margin:16px 0; border:0; border-top:1px solid #ccc;">')
      .replace(/\n/g, '<br>');
    return html;
  }

  function escapeHtml(t) {
    return (t || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function tokenize(text) {

  }

    while (remaining.length > 0) {
      if (remaining.length <= maxLen) {
        chunks.push(remaining);
        break;
      }

      let cutAt = -1;
      const breakChars = ['.', '!', '?', ';', '\n', ','];
      for (let b = 0; b < breakChars.length; b++) {

        if (idx > cutAt) cutAt = idx;
      }

      if (cutAt <= 0) {
        cutAt = remaining.lastIndexOf(' ', maxLen);
      }

      if (cutAt <= 0) {
        cutAt = maxLen;
      }

      chunks.push(remaining.substring(0, cutAt + 1));
      remaining = remaining.substring(cutAt + 1);
    }

    return chunks;
  }

  function clearKeepAlive() {
    if (state.keepAliveTimer) {
      clearInterval(state.keepAliveTimer);
      state.keepAliveTimer = null;
    }

  }

  function restoreCursorToOffset(offset) { cm.select(offset); }

  // === Voice picker ===
  function updateVoicePickerDisplay() {
    const voice = state.voices.find(function(v) { return v.name === state.selectedVoiceName; });
    voicePickerDisplay.textContent = voice ? (voice.name + ' [' + voice.lang + ']') : 'Selecione uma voz...';
  }

  function renderVoicePicker(filter) {
    voicePickerList.innerHTML = '';
    const f = (filter || '').toLowerCase().trim();
    const filtered = f ? state.voices.filter(function(v) { return (v.name + ' ' + v.lang).toLowerCase().includes(f); }) : state.voices;
    if (!filtered.length) {
      voicePickerList.innerHTML = '<div class="voice-no-results">Nenhuma voz encontrada</div>';
      return;
    }
    const groups = {};

  voicePickerDisplay.onclick = function(e) {

  }

function speakChunks(unused, chunkIdx, offset, unusedTokens) {
  if(state._stopRequested||offset>=speechText.length){if(!state._stopRequested)restoreEditorMode();return;}
  const generation=speechSession;
  // Lazy synthesis: allocate at most one ~3K utterance and inspect bounded punctuation.
  let end=Math.min(speechText.length,offset+3000);

    let part=speechText.slice(offset,end),cut=-1;
    for(const c of ['.','!','?',';','\n',','])cut=Math.max(cut,part.lastIndexOf(c));

  // -----------------------------------------------------------------------
  // Fecha o painel
  // -----------------------------------------------------------------------
  function closeFind() {
    clearFindHighlight();

  function findKeyHandler(e) {
    if (e.key === 'Escape') { e.stopPropagation(); closeFind(); }
    if (e.key === 'Enter' && document.activeElement === fpFind) {
      e.preventDefault();
      // Se ainda não buscou, busca. Se já buscou, vai ao próximo.
      if (matches.length === 0) {
        findAllMatches();
      } else {
        goToMatch(currentMatch + 1);
      }
    }
  }

  function clearFindHighlight() {
    // Do not clear the model selection when a virtual DOM range is absent.

  function updateCounter() {
    if (matches.length === 0) {
      fpCounter.textContent = state.findText ? '0 resultados' : '—';
      fpCounter.style.color = state.findText ? '#b91c1c' : '#374151';
    } else {
      fpCounter.textContent = (currentMatch + 1) + ' de ' + matches.length;
      fpCounter.style.color = '#15803d';
    }
  }

  // -----------------------------------------------------------------------
  // Busca usando editor.innerText para garantir que os offsets batem
  // com o que está renderizado no DOM, incluindo quebras de linha
  // -----------------------------------------------------------------------
  let searchGeneration=0;
  const matchAt=i=>matches.at?matches.at(i):matches[i];
  async function findAllMatches() {
    const generation=++searchGeneration;
    var needle = fpFind.value;
    state.findText    = needle;
    state.findCase    = fpCase.checked;
    state.replaceText = fpReplace.value;

    clearFindHighlight();
    matches      = [];
    currentMatch = -1;
    fpResult.style.display = 'none';

    if (!needle) { updateCounter(); return; }

    // Usa innerText para que os offsets reflitam exatamente o DOM
    var haystack = cm.text();
    var flags    = state.findCase ? 'g' : 'gi';
    var regex;
    try {
      regex = new RegExp(needle.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), flags);
    } catch(e) { updateCounter(); return; }

    const positions=[];let checkpoint=performance.now(),n=0,m;
    while ((m=regex.exec(haystack))!==null){
      positions.push(m.index,m.index+m[0].length);
      if((++n%2048)===0 && performance.now()-checkpoint>5){
        await new Promise(resolve=>setTimeout(resolve,0));
        if(generation!==searchGeneration||!panel.isConnected)return;
        checkpoint=performance.now();
      }
    }
    if(generation!==searchGeneration||haystack!==cm.text())return;
    const offsets=Uint32Array.from(positions);
    matches={length:offsets.length/2,at(i){return {start:offsets[i*2],end:offsets[i*2+1]};}};

    if(matches.length>0)currentMatch=0;
    updateCounter();

    if (matches.length > 0) {
      currentMatch = 0;
      selectMatchInEditor(matchAt(0));
    }
  }

  function goToMatch(idx) {
    if (matches.length === 0) { findAllMatches(); return; }
    currentMatch = ((idx % matches.length) + matches.length) % matches.length;
    selectMatchInEditor(matchAt(currentMatch));
    updateCounter();
  }

  // -----------------------------------------------------------------------
  // Mapeia um offset de caractere (baseado em innerText) para o nó de
  // texto e posição exatos dentro do contenteditable.
  //
  // A diferença crítica em relação à versão anterior: quando encontramos
  // um elemento de bloco (div, p etc.) que NÃO é o primeiro filho do seu
  // pai, incrementamos o contador em 1 — porque o browser insere um \n
  // implícito entre blocos, e o innerText reflete isso. Sem essa conta,
  // os offsets ficam descalibrados a cada quebra de linha.
  // -----------------------------------------------------------------------
  function selectMatchInEditor(match) {
    if(match){cm.select(match.start,match.end,true);cm.focus();}
  }

  // -----------------------------------------------------------------------
  // Substituir este resultado
  // -----------------------------------------------------------------------
  function replaceOne() {
    if (matches.length === 0 || currentMatch < 0) return;
    var rep   = fpReplace.value;
    var match = matchAt(currentMatch);
    // Trabalha sobre state.texts para persistir, depois re-sincroniza o editor
    var text = state.texts[state.activeTab] || '';

    // Recalcula offset em state.texts (pode diferir 1 char por \n no Edge)
    // por segurança buscamos a ocorrência pela posição atual no innerText
    var haystack = cm.text();
    var needle   = haystack.substring(match.start, match.end);
    var before   = haystack.substring(0, match.start);
    var after    = haystack.substring(match.end);
    var newInner = before + rep + after;

    if(state.hasTokenSpans)clearReadingView();
    cm.replace(match.start,match.end,rep);

    setTimeout(findAllMatches, 0);
  }

  // -----------------------------------------------------------------------
  // Substituir tudo
  // -----------------------------------------------------------------------
  function replaceAll() {
    var needle = fpFind.value;
    var rep    = fpReplace.value;
    state.findText    = needle;
    state.replaceText = rep;
    state.findCase    = fpCase.checked;
    if (!needle) return;

    var flags = state.findCase ? 'g' : 'gi';
    var regex;
    try {
      regex = new RegExp(needle.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), flags);
    } catch(e) { return; }

    var count = ((state.texts[state.activeTab] || '').match(regex) || []).length;
    if(state.hasTokenSpans)clearReadingView();
    const replacedText=(state.texts[state.activeTab] || '').replace(regex, rep);
    state.texts[state.activeTab]=replacedText;cm.replaceAll(replacedText);
    state.isDirty = true;
    saveTabs();
    updateEditor();
    updateStatus();

    matches      = [];
    currentMatch = -1;
    updateCounter();

    fpResult.style.display    = 'block';
    fpResult.style.background = count > 0 ? '#f0fdf4' : '#fef2f2';
    fpResult.style.border     = count > 0 ? '1px solid #86efac' : '1px solid #fca5a5';
    fpResult.style.color      = count > 0 ? '#15803d' : '#b91c1c';
    fpResult.textContent      = count > 0
      ? count + ' substituição(ões) realizada(s).'
      : 'Nenhuma ocorrência encontrada.';
  }

  // -----------------------------------------------------------------------
  // Eventos — SEM oninput automático, só busca ao clicar ou pressionar Enter
  // -----------------------------------------------------------------------
  document.getElementById('fp-search').onclick = findAllMatches;
  document.getElementById('fp-next').onclick   = function() { goToMatch(currentMatch + 1); };
  document.getElementById('fp-prev').onclick   = function() { goToMatch(currentMatch - 1); };
  document.getElementById('fp-rep-one').onclick = replaceOne;
  document.getElementById('fp-rep-all').onclick  = replaceAll;

  fpCase.onchange = function() { searchGeneration++; matches = []; currentMatch = -1; updateCounter(); };
